[project]
name = "qunar-hotel-refund-mock"
version = "0.1.0"
description = "Executable Mock API and workflow for the Qunar hotel refund AI PM portfolio MVP"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["db*", "tests*"]
